<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <p>Extracting content...</p>
    </div>

    <div id="content" style="display: none;">
      <h1 id="clip-title"></h1>
      <p id="clip-source" class="source"></p>

      <label class="toggle-row">
        <input type="checkbox" id="selection-toggle">
        <span>Clip selection only</span>
      </label>

      <div id="clip-preview" class="preview"></div>

      <button id="save-btn" class="save-button">
        Save to Apple Notes
      </button>

      <p id="status" class="status"></p>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
